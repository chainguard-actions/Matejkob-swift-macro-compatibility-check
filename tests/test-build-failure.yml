name: Test build failure for one version fails the action
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake swift CLI
        run: |
          mkdir -p "$RUNNER_TEMP/fakebin"
          cp tests/fixtures/fake-swift/swift "$RUNNER_TEMP/fakebin/swift"
          chmod +x "$RUNNER_TEMP/fakebin/swift"
          echo "$RUNNER_TEMP/fakebin" >> "$GITHUB_PATH"
          echo "FAKE_SWIFT_LOG=$RUNNER_TEMP/swift-calls.log" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/swift-calls.log" "$RUNNER_TEMP/swift-calls.log.version"
      - id: action
        uses: .
        continue-on-error: true
        env:
          FAKE_SWIFT_FAIL_BUILD_VERSION: '510.0.0'
        with:
          major-versions-only: 'true'
          run-tests: 'true'
      - name: Assert action failed but checked remaining versions
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          LOG="$FAKE_SWIFT_LOG"
          echo "outcome: $OUTCOME"
          echo "--- swift calls ---"; cat "$LOG"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when a build fails"; exit 1
          fi
          if ! grep -qx "swift package resolve swift-syntax --version 600.0.0" "$LOG"; then
            echo "FAIL: action stopped instead of continuing to 600.0.0"; exit 1
          fi
          BUILDS=$(grep -cx "swift build" "$LOG")
          TESTS=$(grep -cx "swift test" "$LOG" || true)
          echo "builds=$BUILDS tests=$TESTS"
          [ "$BUILDS" = "3" ] || { echo "FAIL: expected 3 build attempts"; exit 1; }
          [ "$TESTS" = "2" ] || { echo "FAIL: expected tests only for the 2 successful builds"; exit 1; }
          echo "PASS"
