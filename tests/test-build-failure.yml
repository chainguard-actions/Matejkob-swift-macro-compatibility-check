name: Test build failure stops the check
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake swift (fails build on 509.1.0)
        run: |
          mkdir -p /tmp/fake-swift/bin
          rm -f /tmp/fake-swift/calls.log /tmp/fake-swift/current
          cat > /tmp/fake-swift/bin/swift <<'EOF'
          #!/bin/bash
          echo "$*" >> /tmp/fake-swift/calls.log
          if [ "$1" = package ] && [ "$2" = resolve ] && [ "$3" = swift-syntax ]; then
            echo "$5" > /tmp/fake-swift/current
          fi
          cur="$(cat /tmp/fake-swift/current 2>/dev/null)"
          if [ "$1" = build ] && [ "$cur" = "509.1.0" ]; then exit 1; fi
          exit 0
          EOF
          chmod +x /tmp/fake-swift/bin/swift
          echo "/tmp/fake-swift/bin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        continue-on-error: true
      - name: Assert action failed and stopped at failing version
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          LOG=/tmp/fake-swift/calls.log
          cat "$LOG"
          echo "outcome: $OUTCOME"
          [ "$OUTCOME" = "failure" ] || { echo "FAIL: expected failure outcome"; exit 1; }
          last="$(grep '^package resolve swift-syntax --version ' "$LOG" | tail -n1 | awk '{print $5}')"
          echo "last version: $last"
          [ "$last" = "509.1.0" ] || { echo "FAIL: expected to stop at 509.1.0"; exit 1; }
          echo "PASS"
