name: Test build failure for one version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FAIL_BUILD_VERSION: 510.0.0
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake swift on PATH
        run: |
          mkdir -p /tmp/fakebin
          rm -f /tmp/swift-calls.log /tmp/swift-current-version
          cat > /tmp/fakebin/swift <<'EOF'
          #!/bin/bash
          echo "$*" >> /tmp/swift-calls.log
          if [ "$1" = "package" ] && [ "$2" = "resolve" ] && [ "$3" = "swift-syntax" ]; then
            echo "$5" > /tmp/swift-current-version
          fi
          CUR="$(cat /tmp/swift-current-version 2>/dev/null)"
          if [ "$1" = "build" ] && [ "$CUR" = "510.0.0" ]; then exit 1; fi
          exit 0
          EOF
          chmod +x /tmp/fakebin/swift
          echo "/tmp/fakebin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        continue-on-error: true
        with:
          major-versions-only: 'true'
      - name: Assert action failed and all versions were still checked
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "--- swift calls ---"; cat /tmp/swift-calls.log
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure outcome"
            exit 1
          fi
          n=$(grep -cx 'build' /tmp/swift-calls.log); echo "builds: $n"
          if [ "$n" != "3" ]; then
            echo "FAIL: expected all 3 versions to be built despite failure"
            exit 1
          fi
          grep -qx 'package resolve swift-syntax --version 600.0.0' /tmp/swift-calls.log || { echo "FAIL: 600.0.0 not checked after failure"; exit 1; }
          echo "PASS"
