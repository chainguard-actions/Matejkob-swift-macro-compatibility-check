name: Test resolve failure for one version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake swift on PATH
        run: |
          mkdir -p /tmp/fakebin
          rm -f /tmp/swift-calls.log
          cat > /tmp/fakebin/swift <<'EOF'
          #!/bin/bash
          echo "$*" >> /tmp/swift-calls.log
          if [ "$1" = "package" ] && [ "$2" = "resolve" ] && [ "$3" = "swift-syntax" ] && [ "$5" = "509.0.0" ]; then
            exit 1
          fi
          exit 0
          EOF
          chmod +x /tmp/fakebin/swift
          echo "/tmp/fakebin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        continue-on-error: true
        with:
          major-versions-only: 'true'
          run-tests: 'true'
      - name: Assert action failed and failed version was skipped
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "--- swift calls ---"; cat /tmp/swift-calls.log
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure outcome"
            exit 1
          fi
          n=$(grep -cx 'build' /tmp/swift-calls.log); echo "builds: $n"
          if [ "$n" != "2" ]; then
            echo "FAIL: expected 2 builds (509.0.0 skipped after resolve failure)"
            exit 1
          fi
          n=$(grep -cx 'test' /tmp/swift-calls.log); echo "tests: $n"
          if [ "$n" != "2" ]; then
            echo "FAIL: expected 2 test runs"
            exit 1
          fi
          echo "PASS"
