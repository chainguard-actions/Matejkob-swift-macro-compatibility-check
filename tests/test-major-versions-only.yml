name: Test major-versions-only
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake swift
        run: |
          mkdir -p /tmp/fake-swift/bin
          rm -f /tmp/fake-swift/calls.log /tmp/fake-swift/current
          cat > /tmp/fake-swift/bin/swift <<'EOF'
          #!/bin/bash
          echo "$*" >> /tmp/fake-swift/calls.log
          if [ "$1" = package ] && [ "$2" = resolve ] && [ "$3" = swift-syntax ]; then
            echo "$5" > /tmp/fake-swift/current
          fi
          exit 0
          EOF
          chmod +x /tmp/fake-swift/bin/swift
          echo "/tmp/fake-swift/bin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        with:
          major-versions-only: 'true'
      - name: Assert only major versions used
        run: |
          LOG=/tmp/fake-swift/calls.log
          cat "$LOG"
          actual="$(grep '^package resolve swift-syntax --version ' "$LOG" | awk '{print $5}' | tr '\n' ' ')"
          echo "versions: $actual"
          if [ "$actual" != "509.0.0 510.0.0 " ]; then
            echo "FAIL: expected '509.0.0 510.0.0'"
            exit 1
          fi
          builds=$(grep -c '^build' "$LOG" || true)
          [ "$builds" = "2" ] || { echo "FAIL: expected 2 builds, got $builds"; exit 1; }
          echo "PASS"
