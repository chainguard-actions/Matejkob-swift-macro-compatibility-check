name: 'Swift Macro Compatibility Check'

description: 'Builds and optionally tests a Swift package with macros using all relevant swift-syntax versions'

inputs:
  run-tests:
    description: 'Whether to run tests (true/false)'
    required: false
    default: 'false'

  major-versions-only:
    description: 'Whether to test only against major versions (true/false)'
    required: false
    default: 'false'

  verbose:
    description: 'Whether to use verbose output for Swift commands (true/false)'
    required: false
    default: 'false'

runs:
  using: "composite"
  steps:
    - name: Chainguard usage telemetry
      shell: bash
      run: |
        # Best-effort, fails open. Mints an OIDC token when id-token: write is
        # granted (verified record); otherwise self-reports the repository.
        tok=""
        if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
          tok=$(curl -sf --max-time 2 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=actions.chainguard.dev" \
            | sed -n 's/.*"value":"\([^"]*\)".*/\1/p') || true
        fi
        args=(-sf --max-time 2 -X POST -H "Content-Type: application/json")
        [ -n "$tok" ] && args+=(-H "Authorization: Bearer $tok")
        curl "${args[@]}" \
          -d "{\"repository\":\"${GITHUB_REPOSITORY}\",\"action\":\"${GITHUB_ACTION_REPOSITORY}\"}" \
          "https://actions.enforce.dev/actions/v1/record" >/dev/null 2>&1 || true
    - name: Run Swift Macro Compatibility Check Script
      shell: bash
      env:
        RUN_TESTS: ${{ inputs.run-tests }}
        MAJOR_ONLY: ${{ inputs.major-versions-only }}
        VERBOSE: ${{ inputs.verbose }}
      run: |
        # Pass input values to the script
        ARGS=()
        if [ "$RUN_TESTS" = "true" ]; then
          ARGS+=(--run-tests)
        fi
        if [ "$MAJOR_ONLY" = "true" ]; then
          ARGS+=(--major-versions-only)
        fi
        if [ "$VERBOSE" = "true" ]; then
          ARGS+=(--verbose)
        fi

        # Execute the external script with the arguments
        bash "$GITHUB_ACTION_PATH/swift-macro-compatibility-check.sh" ${ARGS[@]+"${ARGS[@]}"}

branding:
  icon: 'check-circle'
  color: 'green'